<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: workbench — pixel tank on the left, tool rail on the right; stacks to one column under 880px.
   Single committed dark look (a lit glass tank in a dark room), so no light theme. */
:root{
  --bg:#11141b;
  --tank:#0c0f15;
  --panel:#181c26;
  --line:#272e3c;
  --fg:#ebe6da;
  --muted:#8e95a6;
  --accent:#f2b448;
  --accent-ink:#1d1506;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{box-sizing:border-box;max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 i{font-style:normal;color:var(--accent)}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
main{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:18px;align-items:start}
.stagecol{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:center}
.fastbadge{position:absolute;top:8px;right:8px;font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:2px;pointer-events:none}
.stage{position:relative;width:100%;max-width:calc((100dvh - 120px) * 1.5);min-width:min(100%,320px);border:1px solid var(--line);background:var(--tank);border-radius:3px;overflow:hidden;box-shadow:0 0 0 4px var(--panel)}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0;text-wrap:balance}
kbd{font-family:var(--f-mono);font-size:11px;padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--fg);background:var(--panel)}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:500 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:74px}
.btn.warn{border-color:#c4553f;color:#f1a08f}
.btn:focus-visible,.mat:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4em;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.field output{font-family:var(--f-mono);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:500 12px var(--f-mono);background:transparent;color:var(--muted);border:0;padding:5px 8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--accent)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.cat{border-top:1px solid var(--line)}
.cat:last-child{border-bottom:1px solid var(--line)}
.cat summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 4px;cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--fg)}
.cat summary::-webkit-details-marker{display:none}
.cat summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.cat[open] summary::before{transform:rotate(90deg)}
.cat summary:hover{color:var(--accent)}
.cat summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cat summary .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;letter-spacing:0;color:var(--muted);font-weight:400}
.cat .mats{padding:0 0 10px}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}
.mat{display:flex;align-items:center;gap:8px;padding:5px 8px;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--fg);font:500 13px var(--f-body);cursor:pointer;text-align:left;min-width:0}
.mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat:hover{background:var(--panel)}
.mat[aria-pressed=true]{border-color:var(--accent);background:var(--panel)}
.sw{width:14px;height:14px;flex:none;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.card .sw{width:30px;height:30px;grid-row:span 2}
.card h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.1}
.card .kind{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:lowercase}
.card p{grid-column:1/-1;margin:6px 0 0;color:var(--fg);opacity:.86;font-size:13px}
@media (max-width:880px){
  main{grid-template-columns:minmax(0,1fr)}
  .stage{max-width:100%}
  .mats{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="app">

    <h1>Grain<i>fall</i></h1>

          <div class="seg" role="group" aria-label="Simulation speed" id="speed">
            <button data-s="0.5" aria-pressed="false">½×</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="5" aria-pressed="false">Fast</button>
          </div>
        </div>
      </div>
      <div class="card" id="card">
        <div class="sw" id="cardSw"></div>
        <h3 id="cardName">Sand</h3>
        <div class="kind" id="cardKind">powder</div>
        <p id="cardDesc"></p>
      </div>
      <div id="palette"></div>
    </aside>
  </main>
</div>

for (const d of DEFS) {
  const [id,name,kind,dens,col,vary,group,desc] = d;
  M[id] = {id,name,kind,dens,col,vary,group,desc};
  KIND[id] = kind; DENS[id] = dens;
}

// ---- Grid state ------------------------------------------------------------
let type = new Uint8Array(N), life = new Int16Array(N), shade = new Uint8Array(N), clk = new Uint8Array(N), lvl = new Uint8Array(N).fill(4);
let tick = 1;
const evt = { boom: 0, hiss: 0, sizzle: 0, pop: 0 };

function set(i, t, l, v = 4) { type[i] = t; life[i] = l | 0; shade[i] = (R() * 256) | 0; lvl[i] = v; clk[i] = tick; }
function spawnAt(i, m, v) {
  let l = initLife(m);
  if (m === FIRE) l *= 0.6 + v * 0.12;
  set(i, m, l, v);
}
function swap(i, j) {
  const t = type[i]; type[i] = type[j]; type[j] = t;
  const l = life[i]; life[i] = life[j]; life[j] = l;
  const s = shade[i]; shade[i] = shade[j]; shade[j] = s;
  const v = lvl[i]; lvl[i] = lvl[j]; lvl[j] = v;
  clk[i] = clk[j] = tick;
}
function initLife(m) {
  switch (m) {
    case FIRE: return 20 + R() * 40;
    case SMOKE: return 80 + R() * 80;
    case STEAM: return 250 + R() * 250;
    case EMBER: return 250 + R() * 300;
    case BCOAL: return 900 + R() * 900;
    default: return 0;
  }
}
const sink = (a, b) => b === E || (KIND[b] !== STATIC && DENS[a] > DENS[b]);
const rise = (a, b) => b === E || ((KIND[b] === LIQUID || KIND[b] === GAS) && DENS[b] > DENS[a]);

const DX = [-1,0,1,-1,1,-1,0,1], DY = [-1,-1,-1,0,0,1,1,1];
function rnb(x, y) {
  const k = (R() * 8) | 0, nx = x + DX[k], ny = y + DY[k];
  return (nx < 0 || ny < 0 || nx >= W || ny >= H) ? -1 : ny * W + nx;
}

// ---- Movement --------------------------------------------------------------
function powder(i, x, y, slide) {
  if (y + 1 >= H) return false;
  const t = type[i], b = i + W, tb = type[b];
  if (sink(t, tb)) {
    if (KIND[tb] === LIQUID && R() < 0.5) return true; // drag while sinking through liquid
    swap(i, b); return true;
  }
  if (!slide) return false;
  const d = R() < 0.5 ? -1 : 1;
  for (let n = 0, s = d; n < 2; n++, s = -s) {
    const nx = x + s;
    if (nx < 0 || nx >= W) continue;
    if (sink(t, type[b + s]) && KIND[type[i + s]] !== STATIC) { swap(i, b + s); return true; }
  }
  return false;
}

function liquid(i, x, y, disp) {
  const t = type[i];
  if (y + 1 < H) {
    const b = i + W;
    if (sink(t, type[b])) { swap(i, b); return true; }
    const d = R() < 0.5 ? -1 : 1;
    for (let n = 0, s = d; n < 2; n++, s = -s) {
      const nx = x + s;
      if (nx < 0 || nx >= W) continue;
      if (sink(t, type[b + s]) && KIND[type[i + s]] !== STATIC) { swap(i, b + s); return true; }
    }
  }
  const d = R() < 0.5 ? -1 : 1;
  for (let n = 0, s = d; n < 2; n++, s = -s) {
    let last = -1;
    for (let k = 1; k <= disp; k++) {
      const nx = x + s * k;
      if (nx < 0 || nx >= W) break;
      const j = i + s * k;
      if (!sink(t, type[j])) break;
      last = j;
      if (y + 1 < H && sink(t, type[j + W])) break;
    }
    if (last >= 0) { swap(i, last); return true; }
  }
  return false;
}

function gas(i, x, y, p) {
  const t = type[i];
  if (y > 0 && R() < p) {
    const u = i - W;
    if (rise(t, type[u])) { swap(i, u); return; }
  }
  const dx = ((R() * 3) | 0) - 1, dy = R() < 0.5 ? -1 : 0;
  if (dx === 0 && dy === 0) return;
  const nx = x + dx, ny = y + dy;
  if (nx < 0 || nx >= W || ny < 0) return;
  const j = ny * W + nx;
  if (rise(t, type[j])) swap(i, j);
}

// ---- Reactions -------------------------------------------------------------
function explode(cx, cy, r) {
  if (r > evt.boom) evt.boom = r;
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy; if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx; if (x < 0 || x >= W) continue;
      const d2 = dx * dx + dy * dy; if (d2 > r2) continue;
      const j = y * W + x, tj = type[j];
      if (tj === WALL || tj === VOID || tj === CLONE) continue;
      if (tj === GLASS && R() < 0.5) continue;
      if (tj === STONE && R() < 0.6) continue;
      if (tj === DIAMOND) continue;
      if ((tj === OBSID || tj === IRON || tj === GOLD || tj === GRANITE || tj === BASALT || tj === SILVER) && R() < 0.85) continue;
      if ((tj === BRICK || tj === MARBLE || tj === QUARTZ) && R() < 0.6) continue;
      if (tj === GUNP || tj === NITRO) { set(j, FIRE, 3 + R() * 4); continue; }
      const f = d2 / r2;
      if (f < 0.55) set(j, FIRE, 12 + R() * 25);
      else if (R() < 0.5) set(j, SMOKE, 40 + R() * 50);
      else if (KIND[tj] !== STATIC) set(j, E, 0);
    }
  }
}

function popKernel(j) {
  const x = j % W, y = (j / W) | 0;
  set(j, POPCORN, 0);
  for (let k = 0, made = 0; k < 8 && made < 3; k++) {
    const nx = x + DX[k], ny = y + DY[k];
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
    const n = ny * W + nx;
    if (type[n] === E && R() < 0.6) { set(n, POPCORN, 0); made++; }
  }
  evt.pop++;
}
function chill(j, c, str) {
  const r = R() / (str * c / 4);
  switch (type[j]) {
    case WATER:  if (r < 0.006) { set(j, ICE, 0, decay(c)); return true; } break;
    case BRINE:  if (c >= 8 && r < 0.003) { set(j, ICE, 0, decay(c)); return true; } break;
    case STEAM:  if (c >= 5 && r < 0.05) { set(j, SNOW, 0, decay(c)); return true; } break;
    case FIRE:   if (c >= 6 && r < 0.3) { set(j, E, 0); return true; } break;
    case EMBER:  if (c >= 6 && r < 0.03) { set(j, ASH, 0); evt.hiss++; return true; } break;
    case BCOAL:  if (c >= 6 && r < 0.03) { set(j, COAL, 0); evt.hiss++; return true; } break;
    case LAVA:   if (c >= 7 && r < 0.01) { set(j, R() < 0.5 ? OBSID : STONE, 0); evt.hiss++; return true; } break;
    case MOLTEN: if (c >= 7 && r < 0.01) { set(j, (shade[j] & 1) ? IRON : LEAD, 0); evt.hiss++; return true; } break;
    case MWAX:   if (r < 0.02) { set(j, WAX, 0); return true; } break;
  }
  return false;
}
function heat(j, h = 4) {
  if (j < 0) return;
  if (h >= 7) {
    const tj = type[j];
    if (MELTS.has(tj) && R() < (h - 6) * 0.02) { set(j, LAVA, 0, R() < 0.5 ? h : h - 1); return; }
    if (tj === IRON && R() < (h - 6) * 0.004) { set(j, MOLTEN, 600 + R() * 400, h - 1); shade[j] |= 1; return; }
    if (tj === GLASS && h >= 9 && R() < 0.004) { set(j, LAVA, 0, h - 1); return; }
    if (tj === SAND && R() < 0.02) { set(j, GLASS, 0); return; }
  }
  const r = R() * 4 / h, hv = decay(h);
  switch (type[j]) {
    case WOOD:    if (r < 0.02) set(j, EMBER, 200 + R() * 300, hv); break;
    case WOODG:   if (r < 0.03) set(j, BCOAL, 120 + R() * 160, hv); break;
    case PLANT:   if (r < 0.08) set(j, EMBER, 30 + R() * 40, hv); break;
    case OIL:     if (r < 0.25) set(j, FIRE, 30 + R() * 40, hv); break;
    case METHANE: if (r < 0.7) set(j, FIRE, 10 + R() * 15, hv); break;
    case COAL:    if (r < 0.006) set(j, BCOAL, 900 + R() * 900, hv); break;
    case CLAY:    if (r < 0.01) set(j, BRICK, 0); break;
    case LEAD:    if (r < 0.004) { set(j, MOLTEN, 400 + R() * 400, hv); shade[j] &= 0xFE; } break;
    case MAGNES:  if (r < 0.1) set(j, FIRE, 63, hv); break;
    case SULFUR:  if (r < 0.08) set(j, R() < 0.5 ? FIRE : SMOKE, 30 + R() * 30); break;
    case THERMITE:if (r < 0.05) { set(j, MOLTEN, 900 + R() * 600, hv); shade[j] |= 1; } break;
    case PHOS:    if (r < 0.5) set(j, FIRE, 30 + R() * 20, hv); break;
    case SODIUM:  if (r < 0.05) set(j, FIRE, 30, hv); break;
    case WATER:   if (r < 0.01) set(j, STEAM, initLife(STEAM)); break;
    case BRINE:   if (r < 0.01) set(j, SALT, 0); break;
    case APPLE:   if (r < 0.01) set(j, R() < 0.5 ? FIRE : ASH, 20); break;
    case PAPER:   if (r < 0.35) set(j, FIRE, 15 + R() * 15, hv); break;
    case WETPAPER:if (r < 0.01) set(j, PAPER, 0); break;
    case CARDBOARD: if (r < 0.04) set(j, EMBER, 60 + R() * 80, hv); break;
    case POPCORN: if (r < 0.04) set(j, FIRE, 20, hv); break;
    case WAX:     if (r < 0.03) set(j, MWAX, 300 + R() * 300); break;
    case MWAX:    if (r < 0.01) set(j, FIRE, 30, hv); break;
    case KERNEL:  if (r < 0.04) popKernel(j); break;
    case SEED:    if (r < 0.15) set(j, FIRE, 15, hv); break;
    case GUNP:    if (r < 0.5) explode(j % W, (j / W) | 0, 3); break;
    case NITRO:   if (r < 0.6) explode(j % W, (j / W) | 0, 10); break;
    case LN2:     if (r < 0.2) set(j, E, 0); break;
    case ICE:     if (r < 0.12 / lvl[j]) set(j, WATER, 0); break;
    case SNOW:    if (r < 0.32 / lvl[j]) set(j, WATER, 0); break;
  }
}

function upd(t, i, x, y) {
  switch (t) {
    case SAND: case GUNP: case SALT: case COAL: case RUST: case GOLD: case WOODG:
    case GRAVEL: case CLAY: case PUMICE: case MAGNES: case SULFUR: case THERMITE:
    case DIAMOND: case RUBY: case EMERALD: case SAPPHIRE: case AMETHYST:
      powder(i, x, y, true); break;
    case ASH:
      if (R() < 0.0015) { if (R() < 0.3) set(i, SMOKE, 30 + R() * 30); else set(i, E, 0); break; }
      powder(i, x, y, true); break;
    case LN2: {
      const c = Math.min(10, lvl[i] + 5);
      for (let n = 0; n < 2; n++) {
        const j = rnb(x, y); if (j < 0 || type[j] === LN2) continue;
        if (chill(j, c, 30) && R() < 0.3) { set(i, E, 0); return; }
      }
      if (y > 0 && type[i - W] === E && R() < 0.003) { set(i, E, 0); break; }
      liquid(i, x, y, 4); break;
    }
    case STONE:
      powder(i, x, y, false); break;
    case SNOW: {
      const j = rnb(x, y);
      if (j >= 0 && (type[j] === WATER || type[j] === BRINE) && R() < 0.08 / lvl[i]) { set(i, WATER, 0); break; }
      if (j >= 0 && lvl[i] >= 5) chill(j, lvl[i], 0.3);
      if (R() < 0.45) powder(i, x, y, true);
      break;
    }
    case SEED: {
      if (!powder(i, x, y, true) && y + 1 < H) {
        const b = type[i + W];
        if (b === SAND || b === ASH) set(i, PLANT, 20 + R() * 30);
      }
      break;
    }
    case WATER: {
      const j = rnb(x, y);
      if (j >= 0 && type[j] === SALT && R() < 0.04) { set(j, E, 0); set(i, BRINE, 0); break; }
      if (y > 0 && type[i - W] === E && R() < 0.0004) { set(i, STEAM, initLife(STEAM)); break; }
      liquid(i, x, y, 5); break;
    }
    case BRINE:
      if (y > 0 && type[i - W] === E && R() < 0.0003) { set(i - W, STEAM, initLife(STEAM)); set(i, SALT, 0); break; }
      liquid(i, x, y, 4); break;
    case OIL:   liquid(i, x, y, 3); break;
    case NITRO: liquid(i, x, y, 3); break;
    case ACID: {
      const j = rnb(x, y);
      if (j >= 0) {
        const tj = type[j];
        if (tj !== E && tj !== ACID && tj !== WALL && tj !== GLASS && tj !== GOLD && tj !== OBSID && !GEMS.has(tj) && tj !== MERCURY && tj !== VOID && tj !== CLONE && KIND[tj] !== GAS && R() < (tj === LIME ? 0.5 : tj === MARBLE ? 0.2 : 0.1)) {
          if (R() < 0.2) set(j, SMOKE, 30 + R() * 30); else set(j, E, 0);
          evt.sizzle++;
          if (R() < 0.35) { set(i, E, 0); break; }
        }
      }
      liquid(i, x, y, 3); break;
    }
    case LAVA: {
      for (let n = 0; n < 2; n++) {
        const j = rnb(x, y); if (j < 0) continue;
        const tj = type[j];
        if (tj === WATER || tj === BRINE) {
          if (tj === BRINE && R() < 0.4) set(j, SALT, 0); else set(j, STEAM, initLife(STEAM));
          evt.hiss++;
          if (R() < 2.4 / lvl[i]) { set(i, STONE, 0); return; }
        } else if (tj === SAND) { if (R() < 0.004) set(j, GLASS, 0); }
        else if (tj === ICE) { set(j, WATER, 0); if (R() < 0.5) { set(i, OBSID, 0); return; } }
        else if (tj === IRON) { if (R() < 0.0015) set(j, LAVA, 0); }
        else if (tj === E) { if (j < i - 1 && R() < 0.0015) set(j, FIRE, 8 + R() * 10, lvl[i]); }
        else heat(j, lvl[i]);
      }
      if (R() < 0.09 * lvl[i]) liquid(i, x, y, lvl[i] >= 8 ? 2 : 1);
      break;
    }
    case FIRE: {
      if (--life[i] <= 0) { if (R() < 0.3) set(i, SMOKE, 60 + R() * 60); else set(i, E, 0); break; }
      for (let n = 0; n < 2; n++) {
        const j = rnb(x, y); if (j < 0) continue;
        const tj = type[j];
        if ((tj === WATER || tj === BRINE) && lvl[i] >= 8) { set(j, STEAM, initLife(STEAM)); evt.hiss++; continue; }
        if (tj === WATER || tj === BRINE) {
          if (R() < 0.2) { if (tj === BRINE && R() < 0.5) set(j, SALT, 0); else set(j, STEAM, initLife(STEAM)); }
          evt.hiss++; set(i, E, 0); return;
        }
        heat(j, lvl[i]);
      }
      gas(i, x, y, 0.6); break;
    }
    case EMBER: {
      if (--life[i] <= 0) { if (R() < 0.65) set(i, ASH, 0); else set(i, SMOKE, 60 + R() * 60); break; }
      const j = rnb(x, y); if (j < 0) break;
      const tj = type[j];
      if (tj === E) { if (j < i && R() < 0.07) set(j, FIRE, 8 + R() * 14, lvl[i]); }
      else if (tj === WATER || tj === BRINE) { if (R() < 0.3) set(j, STEAM, initLife(STEAM)); set(i, ASH, 0); evt.hiss++; }
      else heat(j, lvl[i]);
      break;
    }
    case BCOAL: {
      if (--life[i] <= 0) { set(i, ASH, 0); break; }
      for (let n = 0; n < 3; n++) {
        const j = rnb(x, y); if (j < 0) continue;
        const tj = type[j];
        if (tj === WATER || tj === BRINE || tj === SNOW || tj === ICE) {
          set(i, COAL, 0);
          if (R() < 0.5) set(j, STEAM, initLife(STEAM)); else if (tj !== WATER && tj !== BRINE) set(j, WATER, 0);
          evt.hiss++; return;
        }
        if (tj === E) { if (j < i && R() < 0.04) set(j, FIRE, 8 + R() * 14, lvl[i]); }
        else heat(j, lvl[i]);
      }
      powder(i, x, y, true); break;
    }
    case SMOKE:
      if (--life[i] <= 0) { set(i, E, 0); break; }
      gas(i, x, y, 0.5); break;
    case STEAM: {
      if (--life[i] <= 0) { if (R() < 0.5) set(i, WATER, 0); else set(i, E, 0); break; }
      const j = rnb(x, y);
      if (j >= 0 && (type[j] === ICE || type[j] === SNOW) && R() < 0.05) { set(i, WATER, 0); break; }
      gas(i, x, y, 0.6); break;
    }
    case METHANE: gas(i, x, y, 0.25); break;
    case MERCURY: liquid(i, x, y, 4); break;
    case APPLE: case WETPAPER: powder(i, x, y, false); break;
    case KERNEL: case POPCORN: powder(i, x, y, true); break;
    case MWAX:
      if (--life[i] <= 0) { set(i, WAX, 0); break; }
      if (R() < 0.5) liquid(i, x, y, 2);
      break;
    case PAPER: case CARDBOARD: {
      const j = rnb(x, y);
      if (j >= 0 && (type[j] === WATER || type[j] === BRINE) && R() < (t === PAPER ? 0.05 : 0.01)) set(i, WETPAPER, 0);
      break;
    }
    case MOLTEN: {
      if (--life[i] <= 0) { set(i, (shade[i] & 1) ? IRON : LEAD, 0); break; }
      for (let n = 0; n < 2; n++) {
        const j = rnb(x, y); if (j < 0) continue;
        const tj = type[j];
        if (tj === WATER || tj === BRINE) { set(j, STEAM, initLife(STEAM)); evt.hiss++; life[i] -= 60; }
        else if (tj === SAND) { if (R() < 0.01) set(j, GLASS, 0); }
        else if (tj === IRON && (shade[i] & 1)) { if (R() < 0.01) { set(j, MOLTEN, life[i]); shade[j] |= 1; } }
        else if (tj === E) { if (j < i - 1 && R() < 0.002) set(j, FIRE, 8 + R() * 8, lvl[i]); }
        else heat(j, lvl[i]);
      }
      if (R() < 0.6) liquid(i, x, y, 2);
      break;
    }
    case COPPER: {
      const j = rnb(x, y); if (j < 0) break;
      const tj = type[j];
      if ((tj === WATER && R() < 0.0015) || (tj === BRINE && R() < 0.005)) set(i, PATINA, 0);
      break;
    }
    case CRYSTAL: {
      const j = rnb(x, y);
      if (j >= 0 && type[j] === BRINE && R() < 0.03) set(j, CRYSTAL, 0);
      break;
    }
    case URANIUM: {
      const j = rnb(x, y); if (j < 0) break;
      const tj = type[j];
      if ((tj === WATER || tj === BRINE) && R() < 0.01) { set(j, STEAM, initLife(STEAM)); evt.hiss++; }
      else if (R() < 0.05) heat(j, lvl[i]);
      break;
    }
    case PHOS: {
      const j = rnb(x, y);
      if (j >= 0 && type[j] === E && R() < 0.0008) { set(i, FIRE, 40); break; }
      powder(i, x, y, true); break;
    }
    case SODIUM: {
      const j = rnb(x, y);
      if (j >= 0 && (type[j] === WATER || type[j] === BRINE)) { set(j, STEAM, initLife(STEAM)); set(i, E, 0); explode(x, y, 3); break; }
      powder(i, x, y, true); break;
    }
    case IRON: {
      const j = rnb(x, y); if (j < 0) break;
      const tj = type[j];
      if ((tj === WATER && R() < 0.002) || (tj === BRINE && R() < 0.008)) set(i, RUST, 0);
      break;
    }
    case ICE: {
      const j = rnb(x, y); if (j < 0) break;
      const tj = type[j], c = lvl[i];
      if ((tj === SALT || tj === BRINE) && R() < 0.08 / c) set(i, WATER, 0);
      else chill(j, c, 1);
      break;
    }
    case PLANT: {
      const j = rnb(x, y);
      if (j >= 0 && type[j] === WATER && R() < 0.03) set(j, PLANT, 0);
      if (life[i] > 0 && R() < 0.08 && y > 0) {
        const nx = x + ((R() * 3) | 0) - 1;
        if (nx >= 0 && nx < W) {
          const k = (y - 1) * W + nx;
          if (type[k] === E) { set(k, PLANT, life[i] - 1); if (R() > 0.12) life[i] = 0; }
        }
      }
      break;
    }
    case CLONE: {
      if (life[i] === 0) {
        for (let k = 0; k < 8; k++) {
          const nx = x + DX[k], ny = y + DY[k];
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const tj = type[ny * W + nx];
          if (tj !== E && tj !== CLONE && tj !== VOID && tj !== WALL) { life[i] = tj; break; }
        }
      } else {
        const j = rnb(x, y);
        if (j >= 0 && type[j] === E && R() < 0.4) set(j, life[i], initLife(life[i]));
      }
      break;
    }
    case VOID: {
      for (let k = 0; k < 8; k++) {
        const nx = x + DX[k], ny = y + DY[k];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx, tj = type[j];
        if (tj !== E && tj !== WALL && tj !== VOID && tj !== CLONE) set(j, E, 0);
      }
      break;
    }
  }
}

function step() {
  tick = (tick % 255) + 1;
  for (let y = H - 1; y >= 0; y--) {
    const ltr = R() < 0.5, row = y * W;
    for (let k = 0; k < W; k++) {

  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = actx.createGain(); master.gain.value = soundOn ? 0.7 : 0;
  const comp = actx.createDynamicsCompressor();
  master.connect(comp).connect(actx.destination);
  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = R() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  pourFilter = actx.createBiquadFilter(); pourFilter.type = 'bandpass';
  pourGain = actx.createGain(); pourGain.gain.value = 0;
  src.connect(pourFilter).connect(pourGain).connect(master); src.start();
}
addEventListener('pointerdown', initAudio, true);
addEventListener('keydown', initAudio, true);
function burst(freq, dur, vol, type = 'bandpass', q = 1, attack = 0.002) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t, R() * 1.5, attack + dur + 0.05);
}
function tone(f0, f1, dur, vol, type = 'sine') {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function scratch() {
  const now = performance.now();
  if (now - lastScratch < 35) return;
  lastScratch = now;
  const m = erasing ? E : sel === CUP ? GLASS : sel;
  if (m === GLASS) { burst(5200 + R() * 2000, 0.03, 0.05, 'bandpass', 6); if (R() < 0.08) tone(2400 + R() * 1600, 2300, 0.15, 0.015); }
  else if (KIND[m] === STATIC) burst(2500 + R() * 1500, 0.03, 0.05, 'bandpass', 2);
}
function updateSound() {
  if (!actx) return;
  const t = actx.currentTime;
  let target = 0;
  if (drawing && soundOn) {
    const m = erasing ? E : sel === CUP ? GLASS : sel, k = KIND[m];
    let f = 3000, q = 1;
    if (m === E) { f = 500; q = 0.7; target = 0.05; }
    else if (k === POWDER) { f = (m === GOLD || m === STONE) ? 1600 : m === SNOW ? 7000 : m === WOODG ? 2600 : 4200; q = 0.8; target = 0.13; }
    else if (k === LIQUID) {
      f = m === LAVA ? 260 : 650 + 450 * Math.sin(t * 23) * Math.sin(t * 7); q = m === LAVA ? 2 : 5; target = 0.2;
      if (m !== LAVA && R() < 0.2) tone(350 + R() * 700, 900 + R() * 900, 0.06, 0.05);
      if (m === LAVA && R() < 0.06) tone(90 + R() * 60, 180, 0.12, 0.08);
    }
    else if (k === GAS) { f = m === FIRE ? 900 : 2400; q = 0.5; target = 0.06; }
    if (sprayMode && !erasing && canSpray(m)) { f = m === WATER || m === BRINE ? 5200 : 3800; q = 0.6; target = 0.14; }
    pourFilter.frequency.setTargetAtTime(f, t, 0.02);
    pourFilter.Q.setTargetAtTime(q, t, 0.05);
  }
  pourGain.gain.setTargetAtTime(target, t, 0.04);
  if (!soundOn) { evt.boom = evt.hiss = evt.sizzle = evt.pop = 0; return; }

  const now = performance.now();
  if (evt.boom && now - lastBoom > 90) {
    const v = Math.min(1, evt.boom / 10);
    burst(300 + v * 700, 0.4 + v * 1.1, 0.35 + 0.5 * v, 'lowpass', 0.7, 0.004);
    tone(110, 32, 0.35 + v * 0.5, 0.4 + 0.5 * v);
    lastBoom = now;
  }
  if (evt.hiss && now - lastHiss > 70) {
    burst(3500, 0.2 + Math.min(evt.hiss, 40) / 70, Math.min(0.22, 0.03 + evt.hiss * 0.01), 'highpass', 0.7, 0.02);
    lastHiss = now;
  }
  if (evt.sizzle && now - lastSiz > 45) {
    burst(6500, 0.06, Math.min(0.1, 0.015 + evt.sizzle * 0.004), 'bandpass', 2);
    lastSiz = now;
  }
  if (evt.pop) { for (let k = 0; k < Math.min(evt.pop, 3); k++) { burst(1600 + R() * 1200, 0.03, 0.22, 'bandpass', 1.5); tone(700 + R() * 300, 220, 0.05, 0.08, 'triangle'); } }
  evt.boom = evt.hiss = evt.sizzle = evt.pop = 0;
  if (fireCount && !paused) {
    const p = Math.min(0.9, fireCount / 120), loud = Math.min(1, fireCount / 400);
    if (R() < p) burst(1200 + R() * 3500, 0.008 + R() * 0.03, 0.04 + R() * 0.12 * loud, 'bandpass', 3);
    if (fireCount > 300 && R() < 0.3) burst(600 + R() * 1200, 0.02, 0.1 * loud, 'bandpass', 2);
  }
  if (lavaCount && !paused && R() < Math.min(0.12, lavaCount / 3000)) tone(70 + R() * 70, 140 + R() * 80, 0.14, 0.06);
}

// ---- Loop ------------------------------------------------------------------
const fpsEl = document.getElementById('fps'), countEl = document.getElementById('count');
let fpsT = performance.now(), fpsN = 0;
function loop(now) {
  if (drawing && last) { if (sprayMode && !erasing && canSpray(sel)) emitSpray(last[0], last[1]); else paint(last[0], last[1]); }
  if (!paused) { acc += speed; while (acc >= 1) { step(); stepSpray(); acc -= 1; } }
  render();
  fpsN++;
  if (now - fpsT > 500) {
    fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT));
    fpsT = now; fpsN = 0;
    let c = 0; for (let i = 0; i < N; i++) if (type[i] !== E) c++;
    countEl.textContent = c.toLocaleString();
  }
  showHover(hoverCell);
  updateSound();
  requestAnimationFrame(loop);
}
try { const saved = +localStorage.getItem('grainfall-px'); if ([480, 360, 240, 162, 120].includes(saved)) setPixelSize(saved); } catch (e) {}
select(CUP);
render();
requestAnimationFrame(loop);
})();
