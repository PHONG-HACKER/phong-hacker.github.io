<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stickman Flipbook Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Shantell+Sans:wght@700&display=swap">
<style>
/* Layout: one centered column; the notebook page sits on a dark desk, flipbook controls under it */
:root{
  --desk:#14123a; --desk2:#221d5c; --paper:#F3EEDF; --ink:#2B2B30; --blue:#2A5BD7; --red:#E0412F;
  --text:#ece8ff; --muted:#b9b2e6; --line:rgba(170,130,255,.45);
  --f-hand:"Shantell Sans", "Comic Sans MS", system-ui, sans-serif;
  --f-body:"Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(120% 80% at 50% 0%, var(--desk2), var(--desk));color:var(--text);font:20px/1.4 var(--f-body);
  padding-block:24px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{margin:0;font:700 clamp(28px,5vw,44px)/1.1 var(--f-hand);text-wrap:balance}
a{color:var(--muted)}
a:hover,a:focus-visible{color:var(--text)}
.book{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);background:var(--paper);cursor:pointer}
canvas{display:block;width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:inherit;font-size:20px;color:var(--text);background:rgba(123,77,255,.25);border:1px solid var(--line);border-radius:999px;padding:6px 18px;cursor:pointer;min-width:48px}
button:hover{background:rgba(123,77,255,.45)}
button:focus-visible,input:focus-visible{outline:3px solid #f0a6ff;outline-offset:2px}
#play{background:linear-gradient(90deg,#7b4dff,#d45cff);border:0;min-width:110px;font-weight:700}
input[type=range]{flex:1 1 220px;min-width:0;accent-color:#d45cff}
.count{font-variant-numeric:tabular-nums;color:var(--muted);min-width:9ch;text-align:right}
.speed{display:flex;align-items:center;gap:8px;color:var(--muted)}
select{font:inherit;font-size:18px;color:var(--text);background:var(--desk2);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.tip{margin:0;color:var(--muted);font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stickman Flipbook Duel</h1>
    <a href="https://phong-hacker.github.io/animations/">← Back to My Animations</a>
  </header>
  <div class="book" id="book"><canvas id="cv" width="1920" height="1080" aria-label="Flipbook animation of two stickmen fighting"></canvas></div>
  <div class="controls">
    <button id="play" type="button">▶ Play</button>
    <button id="prev" type="button" aria-label="Previous page">◀</button>
    <button id="next" type="button" aria-label="Next page">▶</button>
    <input id="scrub" type="range" min="1" max="300" value="1" aria-label="Page">
    <span class="count" id="count">1 / 300</span>
    <label class="speed" for="speed">Speed
      <select id="speed"><option value="6">Slow</option><option value="12" selected>Normal</option><option value="24">Fast</option></select>
    </label>
  </div>
  <p class="tip">300 hand-drawn pages at 12 pages a second. Tap the page or press Space to play and pause. Use the arrow keys to flip one page at a time.</p>
</div>

    var ox = s.x, oy = GND - low - (s.lift || 0), J = { hip: hip, sh: sh, hd: hd, eF: eF, hF: hF, eB: eB, hB: hB, kF: kF, fF: fF, kB: kB, fB: fB };
